name: Windows app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,build,dev]"

      - name: Tests
        run: pytest -q

      - name: Build PDFScout.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PDFScout
          --paths .
          --icon packaging\pdfscout.ico
          --add-data "pdfscout\static;pdfscout\static"
          --collect-all pymupdf
          --collect-all webview
          --hidden-import clr
          packaging\pdfscout_app.py

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PDFScout.exe -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PDFScout-windows
          path: dist/PDFScout.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDFScout.exe
