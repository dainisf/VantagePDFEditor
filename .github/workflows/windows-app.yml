name: Windows app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"
          pytest -q

      - name: Build, test and package the installer
        shell: pwsh
        run: ./packaging/build_windows.ps1 -NoVenv

      - name: Show self-test and install logs
        if: always()
        shell: pwsh
        run: Get-ChildItem build -Filter selftest*.txt -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_ }

      - uses: actions/upload-artifact@v4
        with:
          name: PDFScout-Setup
          path: dist/PDFScout-Setup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDFScout-Setup-*.exe
